<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A heraldic seal: a deep indigo field bears a gold eight-pointed star at center, encircled by twelve silver stars on a thin gold orbital ring, framed by concentric gold borders set with twelve gold markers.</desc>

